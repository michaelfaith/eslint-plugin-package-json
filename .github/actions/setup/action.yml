name: Setup

description: Sets up the repo for a typical CI job

inputs:
  cache:
    description: Cache the pnpm store
    default: true
    required: false
  install-flags:
    description: Flags to pass to `pnpm install`
    required: false
    type: string
  node-version:
    description: Node.js version to use
    default: '24'
    required: false
  skip-checkout:
    description: Skip the checkout step if the repo is already checked out
    default: false
    required: false
  working-directory:
    description: Working directory to run commands in
    default: '.'
    required: false

runs:
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      if: ${{ inputs.skip-checkout == 'false' }}
      with:
        persist-credentials: false
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ inputs.cache }}
        install: ${{ inputs.install-flags == '' && inputs.working-directory == '.' }}
        runtime: node@${{ inputs.node-version }}
    - run: pnpm install $INSTALL_FLAGS
      if: ${{ inputs.install-flags != '' || inputs.working-directory != '.' }}
      env:
        INSTALL_FLAGS: ${{ inputs.install-flags }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
  using: composite
