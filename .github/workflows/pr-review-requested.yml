name: PR Review Requested

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - review_requested

jobs:
  pr_review_requested:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove waiting for author label
        run: >-
          gh issue edit "${PULL_REQUEST_NUMBER}" --remove-label "status: waiting for author"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      - if: failure()
        run: |
          echo "Don't worry if the previous step failed."
          echo "See https://github.com/actions-ecosystem/action-remove-labels/issues/221."
