name: OctoGuide

on:
  discussion:
    types:
      - created
      - edited
  discussion_comment:
    types:
      - created
      - deleted
      - edited
  issue_comment:
    types:
      - created
      - deleted
      - edited
  issues:
    types:
      - edited
      - opened
  pull_request_review_comment:
    types:
      - created
      - deleted
      - edited
  pull_request_target:
    types:
      - edited
      - opened

jobs:
  octoguide:
    if: ${{ !endsWith(github.actor, '[bot]') && !contains(github.event.pull_request.labels.*.name, 'autorelease') }}
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      issues: write
      pull-requests: write
    steps:
      - uses: JoshuaKGoldberg/octoguide@a75c6beb5d97acc7832343bef749a7933218ccc0 # 0.23.4
        with:
          config: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rules: |
            {
              "pr-branch-non-default": false
            }
