name: OctoGuide

on:
  pull_request_target:
    types:
      - edited
      - opened

jobs:
  octoguide:
    if: ${{ !endsWith(github.actor, '[bot]') && !contains(github.event.pull_request.labels.*.name, 'autorelease') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: octoguide/bot@0.27.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rules: |
            {
              "pr-title-conventional": true
            }
