name: Anti-Slop

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - ready_for_review
      - reopened

jobs:
  anti-slop:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@v0.3.0
        with:
          blocked-terms: SASSAFRAS
          exempt-draft-prs: true
          failure-add-pr-labels: suspected ai slop
          failure-pr-message: Thanks for the PR! This repository's automated PR quality checks flagged it as likely low-quality or AI-generated, so it's been closed. If you believe that's a mistake, please comment with more context and a maintainer will take a look. You can find out more in our [AI Contribution Policy](https://eslint-plugin-package-json.dev/getting-involved/contributing/#contributing-with-ai).
          require-pr-template: true
      - uses: JoshuaKGoldberg/slop-issue-unlink-action@v0.3.0
        with:
          labels: suspected ai slop
