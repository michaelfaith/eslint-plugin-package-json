name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - beta
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm build --attw
      - run: node dist/index.mjs
      - run: node dist/experimental/index.mjs
      - name: Upload Build Assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-build-assets
          path: dist/

  build_site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm site:build

  dedupe_check:
    name: Dedupe Check
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      # for testing (begin)
      - run: pnpm install --lockfile-only
      - run: git diff pnpm-lock.yaml
      # for testing (end)
      - run: pnpm dedupe --check --prefer-offline

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download Build Assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: ci-build-assets
          path: dist/
      - uses: $/.github/actions/setup
        with:
          skip-checkout: true
          working-directory: ./e2e
      - run: pnpm test
        working-directory: ./e2e

  engines_check:
    name: Engines Check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 22
          - 24.15.0
          - 24
    steps:
      - uses: $/.github/actions/setup
        with:
          cache: false
          install-flags: --prod --engine-strict --ignore-scripts
          node-version: ${{ matrix.node-version }}

  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm format --list-different

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm site:sync
      - run: pnpm lint

  lint_docs:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm docs:generate --check

  lint_knip:
    name: Lint Knip
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint:knip

  test_node:
    name: Test (Node.js ${{ matrix.node-version }}, ESLint ${{ matrix.eslint-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint-version:
          - 9
          - 10
        node-version:
          - 22.22.2
          - 22
          - 24.15.0
          - 24
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install -D eslint@${{ matrix.eslint-version }}
      - run: pnpm test run

  test_os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm run test --coverage
      - uses: codecov/codecov-action@v7.1.1
        if: success() && (matrix.os == 'ubuntu-latest')
        with:
          fail_ci_if_error: true
          use_oidc: true

  type_check:
    name: Type-check (ESLint ${{ matrix.eslint-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint-version:
          - 9
          - 10
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm install -D eslint@${{ matrix.eslint-version }}
      - run: pnpm typecheck

  type_check_site:
    name: Check Site
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm site:check
